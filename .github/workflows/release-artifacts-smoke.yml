name: Release artifacts smoke

on:
  push:
    branches: [main]
    paths:
      - "pyproject.toml"
      - "README.md"
      - "src/**"
      - "requirements.txt"
      - ".github/workflows/release-artifacts-smoke.yml"
  pull_request:
    paths:
      - "pyproject.toml"
      - "README.md"
      - "src/**"
      - "requirements.txt"
      - ".github/workflows/release-artifacts-smoke.yml"
  workflow_dispatch:

concurrency:
  group: release-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Build wheel + sdist
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
          python -m build
          python -m twine check dist/*

      - name: Upload dist/
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  install-smoke:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install wheel into clean environment
        run: |
          python -m venv .venv-wheel
          .venv-wheel/bin/python -m pip install --upgrade pip
          .venv-wheel/bin/python -m pip install dist/*.whl

      - name: Wheel console + import smoke
        run: |
          .venv-wheel/bin/sozo --help >/dev/null
          .venv-wheel/bin/autoagent-clinical --help >/dev/null
          .venv-wheel/bin/python -c "import sozo_generator, sozo_auth, sozo_api; print('wheel_ok', '${{ matrix.python-version }}')"

      # Source distribution path (PyPI / pip without wheel) — catches missing MANIFEST data.
      - name: Install sdist into clean environment
        run: |
          python -m venv .venv-sdist
          .venv-sdist/bin/python -m pip install --upgrade pip
          .venv-sdist/bin/python -m pip install dist/*.tar.gz

      - name: Sdist console + import smoke
        run: |
          .venv-sdist/bin/sozo --help >/dev/null
          .venv-sdist/bin/autoagent-clinical --help >/dev/null
          .venv-sdist/bin/python -c "import sozo_generator, sozo_auth, sozo_api; print('sdist_ok', '${{ matrix.python-version }}')"
