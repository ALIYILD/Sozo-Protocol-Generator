name: Docker build

on:
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - "Dockerfile.unified"
      - "deploy/**"
      - "src/**"
      - "requirements.txt"
      - "pyproject.toml"
      - "alembic/**"
      - "alembic.ini"
      - ".github/workflows/docker-build.yml"
  pull_request:
    paths:
      - "Dockerfile"
      - "Dockerfile.unified"
      - "deploy/**"
      - "src/**"
      - "requirements.txt"
      - "pyproject.toml"
      - "alembic/**"
      - "alembic.ini"
      - ".github/workflows/docker-build.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: write # BuildKit cache export (type=gha cache-to)

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            dockerfile: Dockerfile
            image: sozo-protocol-generator:ci
            host_port: 18080
          - name: unified
            dockerfile: Dockerfile.unified
            image: sozo-protocol-generator-unified:ci
            host_port: 18081
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build (${{ matrix.dockerfile }})
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          tags: ${{ matrix.image }}
          push: false
          load: true
          provenance: false
          sbom: false
          cache-from: type=gha,scope=sozo-docker-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=sozo-docker-${{ matrix.name }}

      - name: Run container (${{ matrix.name }}) and smoke /api/health
        run: |
          set -euo pipefail
          cname="sozo-smoke-${{ matrix.name }}"
          docker rm -f "$cname" >/dev/null 2>&1 || true

          docker run -d --rm \
            --name "$cname" \
            -p 127.0.0.1:${{ matrix.host_port }}:8080 \
            -e "SOZO_ENV=production" \
            -e "SOZO_AUTH_SECRET_KEY=xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx" \
            -e "SOZO_CORS_ORIGINS=https://example.com" \
            "${{ matrix.image }}"

          # Retry health endpoint (startup can take time due to deps/migrations).
          for i in {1..60}; do
            if curl -fsS -m 2 "http://127.0.0.1:${{ matrix.host_port }}/api/health" >/dev/null; then
              break
            fi
            sleep 2
          done

          curl -fsS -m 5 "http://127.0.0.1:${{ matrix.host_port }}/api/health"

          docker logs "$cname" --tail 200 || true
          docker rm -f "$cname" >/dev/null 2>&1 || true
