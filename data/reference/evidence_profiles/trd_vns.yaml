# Evidence search profile — Treatment-Resistant Depression (VNS focus)
# Used by: python -m sozo_generator.cli.main ingest-evidence --condition trd_vns

condition_slug: trd_vns
condition_name: "Treatment-Resistant Depression (VNS / taVNS)"
icd10: F32.9

search_profiles:
  pathophysiology:
    query: >
      treatment-resistant depression[Title/Abstract] AND
      (vagus nerve[Title/Abstract] OR noradrenergic[Title/Abstract] OR
       locus coeruleus[Title/Abstract] OR serotonergic[Title/Abstract] OR
       prefrontal limbic[Title/Abstract] OR default mode network[Title/Abstract])
    filters: [Systematic Review, Meta-Analysis, Review]
    max_results: 20

  tavns_protocols:
    query: >
      treatment-resistant depression[Title/Abstract] AND
      (transcutaneous auricular vagus nerve stimulation[Title/Abstract] OR
       taVNS[Title/Abstract] OR non-invasive vagus nerve stimulation[Title/Abstract])
    filters: [Randomized Controlled Trial, Clinical Trial, Systematic Review, Meta-Analysis]
    max_results: 30

  implanted_vns_comparison:
    query: >
      treatment-resistant depression[Title/Abstract] AND
      (vagus nerve stimulation[Title/Abstract] OR VNS[Title/Abstract]) AND
      (response rate[Title/Abstract] OR remission[Title/Abstract])
    filters: [Randomized Controlled Trial, Systematic Review, Meta-Analysis]
    max_results: 20

  tdcs_trd:
    query: >
      treatment-resistant depression[Title/Abstract] AND
      transcranial direct current stimulation[Title/Abstract]
    filters: [Randomized Controlled Trial, Systematic Review, Meta-Analysis]
    max_results: 20

  tps_protocols:
    query: >
      treatment-resistant depression[Title/Abstract] AND
      (transcranial pulse stimulation[Title/Abstract] OR
       focused ultrasound[Title/Abstract] OR
       low-intensity focused ultrasound[Title/Abstract] OR
       transcranial ultrasound[Title/Abstract])
    max_results: 20

  combined_approaches:
    query: >
      treatment-resistant depression[Title/Abstract] AND
      (combined neuromodulation[Title/Abstract] OR
       multimodal stimulation[Title/Abstract] OR
       augmentation strategy[Title/Abstract])
    filters: [Randomized Controlled Trial, Systematic Review]
    max_results: 15

  assessment_scales:
    query: >
      treatment-resistant depression[Title/Abstract] AND
      (MADRS[Title/Abstract] OR HAM-D[Title/Abstract] OR
       QIDS[Title/Abstract] OR IDS-SR[Title/Abstract]) AND validation[Title/Abstract]
    max_results: 10

  safety:
    query: >
      treatment-resistant depression[Title/Abstract] AND
      (taVNS[Title/Abstract] OR transcutaneous vagus nerve stimulation[Title/Abstract]) AND
      (safety[Title/Abstract] OR adverse effects[Title/Abstract] OR
       tolerability[Title/Abstract])
    max_results: 15

priority_pmids:
  - "23931950"  # Fang 2012 taVNS depression pilot RCT
  - "26476076"  # Rong 2016 taVNS vs sham depression RCT
  - "28869040"  # Liu 2018 taVNS depression 4-week RCT
  - "30522868"  # Hein 2013 taVNS TRD open-label series
  - "34507827"  # Rush 2000 implanted VNS TRD landmark study

notes: >
  This profile focuses specifically on the taVNS/VNS evidence base for
  treatment-resistant depression (failed >=2 adequate antidepressant trials).
  taVNS auricular branch (cymba conchae) targets afferent vagal pathways
  without surgical implantation; 2 x 30-60 min/day sessions typical.
  Implanted VNS (FDA-cleared D-26 indication 2005) provides historical context.
  Combine with tDCS (left DLPFC anodal) for multimodal augmentation protocols.
  Distinguish from unipolar TRD vs bipolar TRD safety considerations.

tps_priority_dois:
