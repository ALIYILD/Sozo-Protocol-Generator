    takeaway: "Higher doses of rTMS are not always associated with increased improvement of depressive symptoms in treatment-resistant patients."
  TPS evidence: 55 papers identified (16 RCT/SR/MA) from Consensus.app tFUS/TPS literature export 2026-04-04.
