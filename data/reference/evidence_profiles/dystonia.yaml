# Evidence search profile — Dystonia
# Used by: python -m sozo_generator.cli.main ingest-evidence --condition dystonia

condition_slug: dystonia
condition_name: "Dystonia (Focal and Generalized)"
icd10: G24.9

search_profiles:
  pathophysiology:
    query: >
      dystonia[Title/Abstract] AND
      (basal ganglia[Title/Abstract] OR sensorimotor cortex[Title/Abstract] OR
       maladaptive plasticity[Title/Abstract] OR inhibitory deficit[Title/Abstract] OR
       cerebellum[Title/Abstract] OR striatum[Title/Abstract])
    filters: [Systematic Review, Meta-Analysis, Review]
    max_results: 20

  tdcs_protocols:
    query: >
      dystonia[Title/Abstract] AND
      transcranial direct current stimulation[Title/Abstract]
    filters: [Randomized Controlled Trial, Clinical Trial, Systematic Review]
    max_results: 25

  focal_dystonia_stimulation:
    query: >
      (focal dystonia[Title/Abstract] OR writer's cramp[Title/Abstract] OR
       cervical dystonia[Title/Abstract] OR blepharospasm[Title/Abstract]) AND
      (non-invasive brain stimulation[Title/Abstract] OR
       transcranial direct current stimulation[Title/Abstract] OR
       transcranial magnetic stimulation[Title/Abstract])
    filters: [Randomized Controlled Trial, Systematic Review]
    max_results: 25

  tps_protocols:
    query: >
      dystonia[Title/Abstract] AND
      (transcranial pulse stimulation[Title/Abstract] OR
       focused ultrasound[Title/Abstract] OR
       low-intensity focused ultrasound[Title/Abstract])
    max_results: 15

  motor_outcomes:
    query: >
      dystonia[Title/Abstract] AND
      (motor learning[Title/Abstract] OR sensorimotor integration[Title/Abstract] OR
       cortical plasticity[Title/Abstract]) AND
      neuromodulation[Title/Abstract]
    filters: [Randomized Controlled Trial, Systematic Review]
    max_results: 15

  assessment_scales:
    query: >
      dystonia[Title/Abstract] AND
      (Burke-Fahn-Marsden dystonia rating[Title/Abstract] OR
       TWSTRS[Title/Abstract] OR Toronto Western Spasmodic Torticollis[Title/Abstract] OR
       Arm Dystonia Disability Scale[Title/Abstract]) AND validation[Title/Abstract]
    max_results: 10

  safety:
    query: >
      dystonia[Title/Abstract] AND
      (transcranial direct current stimulation[Title/Abstract] OR
       non-invasive brain stimulation[Title/Abstract]) AND
      (safety[Title/Abstract] OR adverse effects[Title/Abstract])
    max_results: 10

priority_pmids:
  - "16227393"  # Siebner 1999 tDCS writer's cramp cortical excitability
  - "23083783"  # Quartarone 2012 plasticity dystonia review
  - "20673763"  # Hosseini 2011 tDCS focal hand dystonia RCT
  - "25982428"  # Benninger 2011 tDCS cervical dystonia pilot

notes: >
  M1 cathodal tDCS to suppress pathologically increased cortical excitability is
  the primary rationale. Cerebellar cathodal tDCS is a secondary target given
  cerebellar-basal ganglia circuit involvement.
  Focal hand dystonia (musician's cramp, writer's cramp) has the most evidence.
  Cervical dystonia evidence is largely open-label.
  Evidence base is smaller than tremor/Parkinson's; realistic evidence level C-D.

