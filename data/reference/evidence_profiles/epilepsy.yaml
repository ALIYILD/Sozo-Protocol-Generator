    year: 2025
    study_type: "meta-analysis"
    citations: 0
    takeaway: "Transcranial pulse stimulation (TPS) shows positive effects on cognitive, motor, and mental health outcomes with a high safety profile in neurological and psychiatric conditions."
  - doi: "10.1007/s13534-024-00369-0"
