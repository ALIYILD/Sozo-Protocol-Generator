# Evidence search profile — Epilepsy
# Used by: python -m sozo_generator.cli.main ingest-evidence --condition epilepsy

condition_slug: epilepsy
condition_name: "Epilepsy / Drug-Resistant Seizures"
icd10: G40.9

search_profiles:
  pathophysiology:
    query: >
      epilepsy[Title/Abstract] AND
      (cortical excitability[Title/Abstract] OR seizure threshold[Title/Abstract] OR
       GABAergic[Title/Abstract] OR glutamatergic[Title/Abstract] OR
       hippocampus[Title/Abstract] OR ictal network[Title/Abstract])
    filters: [Systematic Review, Meta-Analysis, Review]
    max_results: 20

  tdcs_protocols:
    query: >
      epilepsy[Title/Abstract] AND
      transcranial direct current stimulation[Title/Abstract]
    filters: [Randomized Controlled Trial, Clinical Trial, Systematic Review]
    max_results: 30

  tacs_protocols:
    query: >
      epilepsy[Title/Abstract] AND
      (transcranial alternating current stimulation[Title/Abstract] OR
       tACS[Title/Abstract] OR oscillatory stimulation[Title/Abstract])
    filters: [Randomized Controlled Trial, Clinical Trial]
    max_results: 15

  tavns_protocols:
    query: >
      epilepsy[Title/Abstract] AND
      (transcutaneous auricular vagus nerve stimulation[Title/Abstract] OR
       taVNS[Title/Abstract] OR non-invasive vagus nerve stimulation[Title/Abstract])
    filters: [Randomized Controlled Trial, Systematic Review, Meta-Analysis]
    max_results: 20

  tps_protocols:
    query: >
      epilepsy[Title/Abstract] AND
      (transcranial pulse stimulation[Title/Abstract] OR
       focused ultrasound[Title/Abstract] OR
       low-intensity focused ultrasound[Title/Abstract] OR
       transcranial ultrasound[Title/Abstract])
    max_results: 15

  seizure_outcomes:
    query: >
      drug-resistant epilepsy[Title/Abstract] AND
      (seizure frequency[Title/Abstract] OR seizure reduction[Title/Abstract]) AND
      (neuromodulation[Title/Abstract] OR brain stimulation[Title/Abstract])
    filters: [Randomized Controlled Trial, Systematic Review]
    max_results: 20

  assessment_scales:
    query: >
      epilepsy[Title/Abstract] AND
      (seizure diary[Title/Abstract] OR QOLIE[Title/Abstract] OR
       Liverpool Seizure Severity Scale[Title/Abstract]) AND validation[Title/Abstract]
    max_results: 10

  safety:
    query: >
      epilepsy[Title/Abstract] AND
      (transcranial direct current stimulation[Title/Abstract] OR
       transcranial magnetic stimulation[Title/Abstract]) AND
      (safety[Title/Abstract] OR seizure provocation[Title/Abstract] OR
       adverse effects[Title/Abstract])
    max_results: 15

priority_pmids:
  - "22579129"  # Fregni 2006 tDCS epilepsy cortical excitability
  - "20219551"  # Nitsche 2009 tDCS effects on seizure threshold review
  - "24269601"  # San-Juan 2011 cathodal tDCS focal cortical dysplasia
  - "25899168"  # Auvichayapat 2016 tDCS in childhood epilepsy RCT

notes: >
  Cathodal tDCS over seizure focus is the primary target (reduces excitability).
  taVNS has growing RCT evidence for drug-resistant epilepsy comparable to
  implanted VNS. tACS targeting gamma/theta for network normalization is emerging.
  Safety: cathodal polarity preferred; anodal over non-epileptiform regions only.
  Exclude DBS and implanted VNS literature unless directly comparing to non-invasive.

tps_priority_dois:
