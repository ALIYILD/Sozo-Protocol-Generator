    citations: 247
    takeaway: "Transcranial focused ultrasound technology shows promise for treating neurological conditions, with potential applications in movement disorders and epilepsy."
  TPS evidence: 31 papers identified (8 RCT/SR/MA) from Consensus.app tFUS/TPS literature export 2026-04-04.
