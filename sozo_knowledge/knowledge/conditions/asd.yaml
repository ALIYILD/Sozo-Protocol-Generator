assessment_profile:
  primary_clinical_scales: >
    ADOS-2 (Autism Diagnostic Observation Schedule — gold standard diagnostic); ADI-R (Autism Diagnostic Interview-Revised — developmental history); SRS-2 (Social Responsiveness Scale); VABS-3 (Vineland Adaptive Behaviour Scales); SCQ (Social Communication Questionnaire); RBS-R (Repetitive Behaviour Scale); CBCL; Sensory Profile-2; PDDBI; ABC (Aberrant Behaviour Checklist)
  neuropsychological_battery: >
    ADOS-2 cognitive subscale; WASI-II/WPPSI (IQ); VABS-3 adaptive behaviour; NEPSY-II (social perception, face recognition, attention); BRIEF-2 (executive function); CANTAB social cognition battery; GARS-3; MoCA/MMSE (if adult); ToM tasks (Theory of Mind); Eyes Test (Baron-Cohen reading the mind in the eyes); Emotion recognition (Cambridge face memory)
  physiological_assessments: >
    Sensory assessment (sensory profile — tactile, auditory, vestibular); HRV (autonomic dysregulation in ASD); Actigraphy (sleep — significant insomnia comorbidity in 70% ASD); GI assessment (gut-brain axis in ASD); Eye tracking (gaze patterns — social preference); Cortisol (HPA in ASD)
  functional_assessments: >
    ADOS-2 social affect + RRB subscores; Vineland adaptive skills; ABC irritability subscale; Sleep diary (critical in ASD); Sensory diary; Social interaction log; School/work participation; CBCL challenging behaviour; Communication progress; Safety assessment (elopement)
  neuroimaging: >
    MRI structural (brain size/growth trajectories in ASD); DTI long-range white matter tracts (↓ FA fronto-temporal); fMRI social tasks (face processing, ToM — ↓ amygdala/STS activation); fMRI resting-state (atypical DMN); MRS (↓ GABA, ↑ glutamate in social brain areas); EEG mu paradigm (action observation)
  assessment_rationale: >
    Mu suppression is key ASD qEEG biomarker for mirror neuron circuit function. TPS RCT 2023 (Brain Commun, 21 cit) — multi-site frontal+parietal+temporal covers ASD social brain network nodes.
  primary_scale: >
    ADOS-2 (gold standard diagnostic — baseline); SRS-2 (weekly/monthly during intervention)
  screening_scales: >
    SCQ (Social Communication Questionnaire — 15 mins); GARS-3
  severity_staging: >
    VABS-3 (Vineland adaptive behaviour — 6-monthly); ABC (Aberrant Behaviour)
  qol_scale: >
    VABS-3 adaptive composite; ABC-C (subscales); CGAS (children)
  follow_up_frequency: >
    Monthly SRS-2 during intervention; 6-monthly VABS-3; 3-monthly ABC; ADOS-2 annually
  comorbidity_screens: >
    CBCL (co-occurring behaviour); BRIEF-2 (executive); Sensory Profile-2; ISI (sleep)
  safety_screens: >
    Safety assessment (elopement/self-harm); Sensory diet monitoring; Medication side effects
  score_thresholds: >
    SRS-2 T-score: 60-65 Mild; 66-75 Moderate; ≥76 Severe. VABS-3 <70 = significant adaptive deficit. ABC irritability subscale ≥18 = significant (primary outcome in many ASD trials).
  qeeg_primary_signature: >
    Mu rhythm suppression deficit at Cz/C3 (mirror neuron biomarker); ↓ Long-range coherence; ↑ Local connectivity; U-shaped power (↑ delta+gamma, ↓ alpha); ↑ Gamma sensory cortices (hyperreactivity)
  qeeg_key_electrodes: "Cz/C3/C4 (mu — mirror neuron); F3/F4 (frontal social); T3/T4 (temporal language/social); P3/P4 (parietal spatial); globally (long-range coherence)"
  qeeg_key_metrics: >
    Mu suppression at Cz (11-13 Hz band, action observation paradigm — ↓ suppression = mirror neuron deficit = ASD biomarker); Long-range coherence F3-P3/T3; Local coherence (↑ in ASD — opposite to long-range); 40 Hz ASSR (altered in ASD); N170 face ERP
  qeeg_eyes_open: >
    ↑ Gamma sensory cortices (sensory hyperreactivity); ↑ Beta; ↓ Alpha (EO — ↓ inhibitory control); ↑ Local frontal coherence
  qeeg_eyes_closed: >
    ↑ Delta/theta; ↑ Gamma (sensory); ↓ Alpha; ↓ Long-range connectivity; ↑ Local hyperconnectivity
  qeeg_event_related: >
    Mu paradigm (action observation — hand actions; ↓ suppression = mirror neuron deficit); N170 face ERP (delayed/reduced in ASD); MMN to social sounds; ASSR 40 Hz; P300 social-cognitive (theory of mind paradigm); ERP to social/non-social stimuli distinction
  qeeg_pathological_threshold: >
    Mu suppression <20% during action observation (ASD marker vs 40-50% in neurotypical); Long-range coherence F3-P3 <0.3 (↓ connectivity); 40 Hz ASSR <-10 dB vs controls
  qeeg_treatment_target: >
    Mu suppression ↑ (Cz — mirror neuron activation restoration); Long-range coherence ↑; 40 Hz gamma normalisation; Frontal alpha ↑; Social brain network connectivity
  qeeg_response_biomarker: >
    Mu suppression change (primary ASD qEEG biomarker); ADOS-2 social affect correlation with mu; N170 face ERP latency change; Long-range coherence restoration


neuromod_profile:
  key_symptoms: >
    Social communication deficits, restricted/repetitive behaviors, sensory sensitivities (hyper/hypo), difficulty with transitions, special interests, executive function challenges
  qeeg_patterns: >
    U-shaped power profile — ↑ low-freq (delta/theta) + ↑ high-freq (beta/gamma), ↓ midrange alpha + beta; ↓ alpha (eyes-open — ↓ inhibitory control); excess beta in Dup15q; ↓ long-range connectivity; ↑ local connectivity
  qeeg_electrodes: "Fz, F3/F4 (frontal changes), Cz (central), T3/T4 (temporal), P3/P4 (parietal), globally altered"
  affected_regions: >
    PFC, temporal cortex, fusiform gyrus (face processing), amygdala, cerebellum, STS (superior temporal sulcus)
  primary_networks_disrupted: >
    Social brain network (impaired — STS, fusiform, amygdala, mPFC), DMN (atypical connectivity), Mirror neuron network (altered), Long-range underconnectivity + local overconnectivity pattern
  network_dysfunction_pattern: >
    Long-range underconnectivity → poor social brain network integration; local overconnectivity → restricted/repetitive processing; ↓ alpha in social cortex → ↓ inhibitory gating of sensory input → sensory sensitivity
  recommended_techniques: >
    TMS DLPFC/SMA; TPS (emerging); tDCS DLPFC; neurofeedback
  primary_stimulation_targets: "DLPFC (F3/F4), SMA (FCz), temporal/social cortex"
  stimulation_rationale: >
    DLPFC TMS/tDCS targets executive function and repetitive behaviors; SMA modulation ↓ motor stereotypies; neurofeedback alpha training → ↑ social cortex inhibitory gating; TPS to enhance long-range connectivity

# ── Deterministic authored content blocks (for long-form 3×2 documents) ──────
content_blocks:
  # ── Clinical exam additions ───────────────────────────────────────────────
  - block_id: asd_assessment_workflow_fellow
    title: "Standardized Intake Workflow (Fellow)"
    doc_types: [clinical_exam]
    section_slugs: [assessment_workflow]
    tier: fellow
    kind: list
    clinician_only: true
    items:
      - Confirm diagnostic context and stage (DSM-5 level; language level; intellectual disability; seizure history).
      - Establish primary treatment goals with caregiver/patient (communication, irritability, anxiety, sleep, sensory, executive function).
      - "Baseline measures: pick 1–2 primary outcomes (SRS-2, ABC-I, RBS-R) plus function (Vineland) when feasible."
      - Screen safety and contraindications for each modality (tDCS/TPS/CES/taVNS) and document off-label disclosure plan.
      - Phenotype assignment (SOC/SENS/RRB/EF/MOOD/SLEEP) with a one-sentence rationale tied to network profile.
      - Define escalation rules and “stop/hold” criteria (new seizures, marked agitation, severe headache, emergent suicidality).
      - Set follow-up schedule (Week 2 tolerance check, Week 4 response checkpoint, Week 8–10 end-of-block decision).

  - block_id: asd_red_flags_all
    title: "Red Flags & Escalation Triggers (ASD)"
    doc_types: [clinical_exam, evidence_based_protocol, handbook]
    section_slugs: [red_flags, safety_screening, safety]
    tier: both
    kind: list
    clinician_only: true
    items:
      - New-onset seizure, status epilepticus, or rapid increase in seizure frequency → urgent medical escalation; hold stimulation.
      - Acute regression (loss of language, major functional drop) or new focal neurological deficit → urgent escalation before treatment.
      - Severe agitation, violent behavior, or uncontrolled self-injury → stabilize and coordinate behavioral/psychiatric care first.
      - Active suicidality or severe depression/anxiety decompensation → urgent escalation and stabilize before neuromodulation.
      - Unclear implant status (DBS/VNS/pacemaker/metal hardware) or recent neurosurgery → confirm safety before any device use.

  # ── Evidence-based protocol: core long-form expansions ─────────────────────
  - block_id: asd_clinical_overview_expanded
    title: "Clinical Overview (Expanded Context)"
    doc_types: [evidence_based_protocol]
    section_slugs: [clinical_overview]
    tier: both
    kind: prose
    clinician_only: true
    text: >-
      Autism Spectrum Disorder (ASD) is a lifelong neurodevelopmental condition defined by differences in
      social communication/interaction and restricted or repetitive behaviors (RRBs), with highly heterogeneous
      presentation across language ability, cognitive profile, sensory processing, comorbidity burden, and
      functional impairment. In clinical operations, two distinctions matter for protocol design: (1) the
      “core ASD” phenotype (social cognition, pragmatic language, RRBs) versus (2) the “overlay phenotype”
      that drives disability and caregiver distress (irritability/aggression, anxiety, sleep disruption,
      ADHD-like executive dysfunction, and sensory dysregulation). Neuromodulation plans should be organized
      around measurable targets that matter to the patient/family (e.g., SRS-2 social responsiveness; ABC-I
      irritability; sleep onset latency; classroom participation), and should be framed as adjunctive and
      off-label/investigational where applicable. The evidence base for non-invasive neuromodulation in ASD
      is emerging, with many small heterogeneous trials; therefore, governance and documentation (baseline,
      safety, objective follow-up, and explicit disclosure) are part of the treatment itself.
    citations:
      - pmid: "32214087"
        citation_key: "Maenner2020_ADDM2016"
        note: "ASD surveillance prevalence paper (ADDM Network)."

  - block_id: asd_pathophysiology_mechanisms_expanded
    title: "Mechanisms & Circuit-Level Rationale"
    doc_types: [evidence_based_protocol]
    section_slugs: [pathophysiology]
    tier: both
    kind: prose
    clinician_only: true
    text: >-
      Mechanistically, ASD is best conceptualized as a family of developmental trajectories that converge on
      atypical network-level communication. Across subgroups, recurring themes include excitation–inhibition
      imbalance (altered GABA/glutamate signaling), atypical thalamocortical gating and sensory prediction,
      and altered long-range integration between frontal control systems and temporal–parietal social cognition
      nodes (TPJ/STS/mPFC). These mechanisms motivate a two-lane protocol strategy: Lane A targets social
      cognition/communication (temporal–parietal and medial prefrontal nodes, often via DLPFC-temporal coupling
      strategies), and Lane B targets regulation and participation (executive control, salience/anxiety circuits,
      sleep and arousal stabilization). In practice, improvements in regulation often unlock participation and
      response to behavioral therapies, even when “core ASD” symptoms change modestly. Protocol selection should
      therefore integrate baseline phenotype, comorbidity overlays, and the family’s prioritized functional goals.

  - block_id: asd_inclusion_exclusion_operational
    title: "Operational Inclusion/Exclusion Notes"
    doc_types: [evidence_based_protocol]
    section_slugs: [inclusion, exclusion]
    tier: both
    kind: prose
    clinician_only: true
    text: >-
      Operationally, neuromodulation candidates are those with (a) stable diagnosis and care team involvement,
      (b) measurable target symptoms with a feasible assessment plan, and (c) the capacity for safe, consistent
      attendance and monitoring (caregiver support, communication supports, and realistic tolerance expectations).
      Exclusion decisions should consider seizure risk and instability, severe behavioral dysregulation that
      prevents safe delivery, and medical instability. Where evidence is limited, the threshold for documentation
      and clinician oversight should increase rather than decrease.

  # ── Evidence-based protocol: device + dosing + monitoring ──────────────────
  - block_id: asd_device_requirements_tdcs
    title: "tDCS Setup Notes (ASD)"
    doc_types: [evidence_based_protocol]
    section_slugs: [device_requirements]
    tier: both
    modalities: [tdcs]
    kind: prose
    clinician_only: true
    text: >-
      Use a conservative, tolerance-first setup. Confirm electrode placement using standardized coordinates,
      document montage and polarity, and prioritize stable contact/impedance over aggressive dosing. For patients
      with sensory sensitivities, consider desensitization steps (brief skin contact practice, predictable routine,
      caregiver involvement, visual schedule). Document ramp-up/down settings and stop criteria. Because ASD trials
      vary widely in montage, dose, and outcomes, avoid unreviewed parameter changes; apply changes only under
      Doctor authorization with a documented rationale tied to outcomes and tolerability.
    citations:
      - pmid: "41861357"
        citation_key: "Singh2026_tDCS_ASD_SRMA"
        note: "Systematic review/meta-analysis of tDCS in ASD (children/adolescents)."
      - pmid: "41412208"
        citation_key: "Efficacy2025_tDCS_ASD_SRMA"
        note: "Systematic review/meta-analysis of pediatric tDCS in ASD (clinical outcomes)."

  - block_id: asd_device_requirements_tps
    title: "TPS Setup Notes (ASD)"
    doc_types: [evidence_based_protocol]
    section_slugs: [device_requirements]
    tier: both
    modalities: [tps]
    kind: prose
    clinician_only: true
    text: >-
      TPS in ASD should be treated as investigational/off-label unless a clear on-label indication applies for the
      specific device and jurisdiction. Confirm target selection, ensure documentation of off-label disclosure and
      consent, and use a standardized positioning workflow (consistent head model/orientation, target landmarks,
      and session logging). For patients with anxiety or sensory sensitivity, plan predictable session pacing and
      include breaks. Any parameter changes require Doctor authorization and a recorded rationale.

  - block_id: asd_session_schedule_template
    title: "Example Session Schedule (Template)"
    doc_types: [evidence_based_protocol]
    section_slugs: [session_schedule]
    tier: both
    kind: table
    clinician_only: true
    table:
      caption: "Example schedule (adjust per age, phenotype, comorbidities, and tolerability)"
      headers: ["Week", "Sessions", "Clinical focus", "Decision points"]
      rows:
        - ["0–1", "1–2", "Orientation + tolerance", "Confirm baseline measures; finalize goals; complete consent/off-label disclosures"]
        - ["1–2", "2–3/week", "Stabilize routine", "If intolerance → step down; if stable → continue"]
        - ["3–4", "2–3/week", "Primary target block", "Week-4 checkpoint: responder/partial/non-responder classification"]
        - ["5–8", "2/week", "Titration + consolidation", "Only adjust with Doctor authorization; document outcome deltas"]
        - ["8–10", "1–2/week", "Maintenance planning", "End-of-block outcomes; decide maintenance vs stop vs re-phenotype"]

  - block_id: asd_titration_rules_summary
    title: "Progression & Titration Rules (Summary)"
    doc_types: [evidence_based_protocol]
    section_slugs: [session_schedule, followup]
    tier: both
    kind: list
    clinician_only: true
    items:
      - Prefer increasing consistency and adherence before increasing intensity or changing montages.
      - Adjust one variable at a time (dose OR montage OR cadence), and only with Doctor authorization.
      - If agitation/anxiety increases within 24–48h after sessions, hold escalation and re-check sleep, schedule, and comedications.
      - If seizures occur or seizure frequency increases, stop treatment and escalate medically; re-start only after clearance.
      - Require a documented outcome delta at Week 4 before continuing a “core symptom” target plan unchanged.

  - block_id: asd_monitoring_adverse_events
    title: "Monitoring & Adverse Event Workflow (ASD)"
    doc_types: [evidence_based_protocol, handbook]
    section_slugs: [monitoring_adverse_events, stage_6]
    tier: both
    kind: list
    clinician_only: true
    items:
      - "Pre-session: screen sleep, illness, seizures, new meds; confirm baseline anxiety level and behavioral stability."
      - "During: monitor distress signals (avoidance, agitation, shutdown); pause/stop for severe discomfort; document response."
      - "Post-session: record parameters, tolerance, and any headache/dizziness/mood change; schedule follow-up if events occur."
      - "Between sessions: caregiver-reported sleep/behavior logs; rapid check-in if irritability or anxiety worsens."

  - block_id: asd_responder_criteria_tracking
    title: "Responder Criteria (Operational)"
    doc_types: [evidence_based_protocol, handbook]
    section_slugs: [responder_criteria, stage_7]
    tier: both
    kind: list
    clinician_only: true
    items:
      - Define 1–2 primary outcomes at baseline (e.g., SRS-2, ABC-I, sleep onset latency) and pre-specify the minimal meaningful change.
      - "Responder: clear improvement in primary outcome(s) with stable or improved function/participation and acceptable tolerability."
      - "Partial responder: modest improvement with strong adherence/tolerability → consider extending block or minor authorized adjustment."
      - "Non-responder: no meaningful change by Week 4–6 → re-phenotype, reconsider target lane (regulation vs core symptoms), reassess comorbidities."

  # ── Handbook: stage-by-stage operational guidance ──────────────────────────
  - block_id: asd_handbook_stage_1_notes
    title: "Stage 1 Notes (ASD)"
    doc_types: [handbook]
    section_slugs: [stage_1]
    tier: both
    kind: prose
    clinician_only: true
    text: >-
      Pre-screening for ASD must include caregiver capacity and session feasibility (transport, school schedule,
      tolerance of headgear/electrodes, and the ability to track outcomes). Request baseline collateral:
      prior diagnostic reports (ADOS/ADI-R when available), school or therapy plans, seizure history, and current
      medications. Where there is high behavioral volatility, coordinate stabilization first to avoid false “non-response.”

  - block_id: asd_handbook_stage_2_consent
    title: "Stage 2 Consent & Communication (ASD)"
    doc_types: [handbook]
    section_slugs: [stage_2]
    tier: both
    kind: prose
    clinician_only: true
    text: >-
      Consent in ASD is a process, not a single form. Use plain language and visual supports where appropriate.
      For minors or adults with limited capacity, ensure caregiver consent and assent processes are documented.
      Explicitly document investigational/off-label status by modality and indication, and set expectations that
      improvements may be incremental and domain-specific (regulation, sleep, participation).

  - block_id: asd_handbook_stage_3_intake
    title: "Stage 3 Psychological Intake (ASD)"
    doc_types: [handbook]
    section_slugs: [stage_3]
    tier: both
    kind: prose
    clinician_only: true
    text: >-
      Intake should separate core ASD traits from treatable overlays (anxiety, ADHD, sleep, irritability, depression,
      trauma exposure). Document communication profile (receptive/expressive), sensory triggers, and high-risk behaviors
      (elopement, self-injury). Choose scales that can be reliably repeated in your setting; avoid over-instrumentation
      that reduces adherence.

  - block_id: asd_handbook_stage_4_exam
    title: "Stage 4 Examination & Phenotype (ASD)"
    doc_types: [handbook]
    section_slugs: [stage_4]
    tier: both
    kind: prose
    clinician_only: true
    text: >-
      Use structured observation and caregiver report to confirm the dominant phenotype lane: social cognition/communication,
      sensory dysregulation, RRB rigidity/inflexibility, executive dysfunction/attention, mood/anxiety, or sleep.
      Document the primary lane and a secondary lane. This drives target prioritization and prevents “everything at once”
      protocols that are hard to interpret.

  - block_id: asd_handbook_stage_5_protocol_selection
    title: "Stage 5 Protocol Selection Notes (ASD)"
    doc_types: [handbook]
    section_slugs: [stage_5]
    tier: both
    kind: prose
    clinician_only: true
    text: >-
      Select protocols by mapping lane → network target → modality feasibility. When family goals prioritize participation
      and daily functioning, stabilize regulation (sleep/anxiety/irritability) before pursuing subtle core-symptom shifts.
      Maintain a “one-change” rule for parameter adjustments and align all changes with measured outcomes.

  - block_id: asd_handbook_stage_6_delivery
    title: "Stage 6 Delivery Notes (ASD)"
    doc_types: [handbook]
    section_slugs: [stage_6]
    tier: both
    kind: prose
    clinician_only: true
    text: >-
      Predictability is the primary safety intervention: consistent session structure, clear start/stop cues, and a brief
      tolerance protocol for sensory-sensitive patients. Use caregiver presence strategically. Document adverse events in a
      structured way, distinguishing transient discomfort from behavioral escalation requiring plan change.

  - block_id: asd_handbook_stage_7_response
    title: "Stage 7 Response Tracking Notes (ASD)"
    doc_types: [handbook]
    section_slugs: [stage_7]
    tier: both
    kind: prose
    clinician_only: true
    text: >-
      Response in ASD may present as “access gains” (more eye contact, tolerance of demands, improved sleep, fewer meltdowns)
      before standardized scores shift. Track both an objective scale and a practical functional marker (school attendance,
      therapy participation, family routines). At Week 4, make a decision: continue unchanged (responder), minor authorized
      adjustment (partial), or re-phenotype (non-responder).

  - block_id: asd_handbook_stage_8_maintenance
    title: "Stage 8 Maintenance & Discharge Notes (ASD)"
    doc_types: [handbook]
    section_slugs: [stage_8]
    tier: both
    kind: prose
    clinician_only: true
    text: >-
      Maintenance planning should prioritize sustainability and family burden. For responders, taper frequency while
      preserving routine. Provide a relapse plan (sleep disruption, school transitions) and coordinate with behavioral and
      educational supports to preserve gains.

  # ── Patient handouts (must be clinician_only: false) ───────────────────────
  - block_id: asd_patient_handout_overview
    title: "Family Handout: What This Treatment Is"
    doc_types: [handbook]
    section_slugs: [patient_handouts]
    tier: both
    clinician_only: false
    kind: prose
    text: >-
      This program uses non-invasive neuromodulation techniques (such as gentle electrical stimulation or focused pulses,
      depending on the plan) together with careful tracking of symptoms and day-to-day functioning. In autism, these
      approaches are often considered off-label or investigational. Your clinician will explain what is known, what is
      uncertain, and what outcomes we will track together. Many families focus on practical goals such as better sleep,
      fewer meltdowns, improved participation in school/therapy, and smoother daily routines.

