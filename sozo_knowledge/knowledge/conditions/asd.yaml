  # ── Evidence-based protocol: long-form clinical operations (adds bulk) ─────
  - block_id: asd_inclusion_exclusion_longform
    title: "Inclusion/Exclusion: Practical Decision Guide"
    doc_types: [evidence_based_protocol]
    section_slugs: [inclusion_exclusion]
    tier: both
    clinician_only: true
    kind: prose
    text: >-
      This section operationalizes inclusion/exclusion criteria for ASD protocols to reduce variability across clinicians.
      Start by confirming that the presenting problems are both measurable and actionable. “Measurable” means you can
      collect baseline and follow-up data in the same way at least twice (e.g., SRS-2 weekly or biweekly; ABC-I every
      2–4 weeks; caregiver sleep log nightly; school participation tracker). “Actionable” means the target symptom is
      plausibly linked to a network-level lane with a clear plan for dosing, monitoring, and escalation. Where ASD
      neurobiology is heterogeneous, protocol success depends on implementation discipline: adherence, consistent
      measurement, and documented adjustments.
      
      Inclusion is strongest when (a) the patient/family can attend sessions reliably, (b) the comorbidity overlay is
      stable enough to interpret change (no ongoing medication churn, acute crisis, or untreated sleep disorder), and
      (c) there is an active support system to generalize gains (school accommodations, therapy, caregiver coaching).
      Consider a brief stabilization phase (sleep hygiene plan, anxiety supports, sensory plan) before starting a
      neuromodulation block if baseline volatility is high; otherwise, non-response is uninterpretable.
      
      Exclusion is not only about device contraindications. Exclude or defer when there is uncontrolled seizure activity,
      medical instability, severe behavioral dysregulation that creates unsafe sessions, or inability to track outcomes.
      For patients with high sensory sensitivity, deferral is often unnecessary; instead, build a tolerance protocol
      (predictable sequence, shorter initial sessions, caregiver presence, and clear stop cues) and document the plan.

  - block_id: asd_tdcs_protocol_notes_longform
    title: "tDCS Protocol Implementation Notes (ASD)"
    doc_types: [evidence_based_protocol]
    section_slugs: [protocols_tdcs]
    tier: both
    clinician_only: true
    kind: prose
    modalities: [tdcs]
    text: >-
      Implementation principle: treat tDCS in ASD as a structured “behavioral pharmacology” trial. You are not only
      delivering current; you are delivering a repeatable routine that interacts with arousal, sleep, expectation, and
      caregiver scaffolding. Therefore, the protocol has two outputs: (1) neuromodulatory dose exposure and (2) adherence
      and tolerability data that enable learning. Keep the first 1–2 weeks tolerance-first with conservative parameters,
      then progress only if tolerability is stable and outcome tracking is in place.
      
      In ASD, the most common operational failures are not physiological; they are measurement and interpretation failures:
      changing multiple parameters at once, adding/removing medications mid-block without documentation, or switching
      targets before Week-4 outcomes. Use a “one-change rule” (dose OR montage OR cadence) and record the hypothesis for
      every change. If the family goal is regulation, prioritize stability and generalization rather than chasing small
      score changes. If the goal is social cognition, ensure that the patient is receiving parallel social learning inputs
      (therapy, coaching) so that any gains can be expressed.
      
      Safety/tolerability notes: sensory discomfort can be misread as behavioral escalation. Distinguish distress from
      adverse events by documenting timing, context, and recovery. Use clear stop criteria and predictable session
      structure. When headaches occur, reduce dose progression, check hydration and sleep, and consider shorter ramps.
    citations:
      - pmid: "41861357"
        citation_key: "Singh2026_tDCS_ASD_SRMA"
      - pmid: "41412208"
        citation_key: "Efficacy2025_tDCS_ASD_SRMA"

  - block_id: asd_tps_protocol_notes_longform
    title: "TPS Protocol Implementation Notes (ASD)"
    doc_types: [evidence_based_protocol]
    section_slugs: [protocols_tps]
    tier: both
    clinician_only: true
    kind: prose
    modalities: [tps]
    text: >-
      TPS delivery in ASD should follow a strict governance posture: off-label disclosure, conservative dosing,
      standardized targeting workflow, and outcome-driven progression. Because evidence is variable and patient
      heterogeneity is high, TPS should not be used as a “last resort” in acute instability; it should be used in
      a stable operational context where changes can be measured.
      
      Targeting strategy should match lane selection: social cognition lane emphasizes temporal–parietal and medial
      prefrontal nodes; regulation lane emphasizes prefrontal control and salience stabilization. Operationally, do not
      change targets without a Week-4 review and documented rationale. Where the patient has anxiety or sensory
      defensiveness, prioritize predictable pacing and communication supports. Document tolerance, any behavioral
      changes within 24–48 hours, and caregiver observations using a structured template.

  - block_id: asd_safety_longform
    title: "Safety & Risk Management (ASD)"
    doc_types: [evidence_based_protocol, handbook]
    section_slugs: [safety]
    tier: both
    clinician_only: true
    kind: prose
    text: >-
      Safety in ASD is primarily about predictability, escalation pathways, and medical risk screening. Medical risks
      include seizure disorders (higher prevalence in ASD, especially with intellectual disability), medication changes
      (stimulants, SSRIs, antipsychotics), sleep disruption, and dehydration/poor intake that can increase headache and
      irritability. Behavioral risks include aggression, elopement, and self-injury, which can create unsafe sessions if
      not anticipated. The safety plan should specify “hold” criteria (new seizures, marked agitation, severe headache,
      significant sleep collapse, or new neurologic symptoms) and the escalation workflow.
      
      Use caregiver education as a safety tool. Families should know what to report, how quickly to report it, and what
      to do after-hours for urgent symptoms. Encourage simple daily tracking (sleep, irritability, major stressors) so
      that adverse trends are detected early rather than after a failed block. When risk is unclear, reduce exposure by
      shortening sessions or lowering cadence, rather than continuing unchanged without data.

  # ── Handbook: add bulk to introduction + modalities + patient journey ──────
  - block_id: asd_handbook_introduction_expanded
    title: "Introduction (Expanded Operational Guide)"
    doc_types: [handbook]
    section_slugs: [introduction]
    tier: both
    clinician_only: true
    kind: prose
    text: >-
      This handbook organizes ASD care around an operational reality: the greatest improvements often occur when
      regulation improves enough for the patient to access learning and relationships. Therefore, treatment blocks are
      designed to be measurable, repeatable, and interpretable. Choose a small set of outcomes, maintain protocol
      discipline for at least 4 weeks, and adjust only when tolerability and measurement justify it.
      
      The SOZO approach integrates neuromodulation with structured monitoring and family-centered goals. It is not a
      replacement for behavioral therapies, educational supports, or medical management of comorbidities. Instead, it is
      a framework for creating a stable platform on which therapies can work better. Clinicians must document off-label
      status where applicable, maintain governance rules for parameter changes, and use a clear responder/non-responder
      pathway.

