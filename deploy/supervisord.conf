[supervisord]
nodaemon=true
logfile=/var/log/sozo/supervisord.log
pidfile=/var/run/supervisord.pid
loglevel=info

[program:redis]
command=redis-server --bind 127.0.0.1 --port 6379 --save "" --appendonly no
autostart=true
autorestart=true
priority=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:fastapi]
command=uvicorn sozo_api.server:app --host 127.0.0.1 --port 8000 --log-level info
directory=/app
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=PYTHONPATH="/app/src",PYTHONUNBUFFERED="1",CELERY_BROKER_URL="redis://127.0.0.1:6379/0"

[program:celery]
command=celery -A sozo_api.celery_app.celery_app worker --loglevel=info --concurrency=1
directory=/app
autostart=true
autorestart=true
priority=20
startsecs=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=PYTHONPATH="/app/src",PYTHONUNBUFFERED="1",CELERY_BROKER_URL="redis://127.0.0.1:6379/0"

[program:streamlit]
command=streamlit run /app/app.py
    --server.port=8501
    --server.address=127.0.0.1
    --server.baseUrlPath=/ops
    --server.headless=true
    --server.enableCORS=false
    --server.enableXsrfProtection=false
    --browser.gatherUsageStats=false
directory=/app
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=PYTHONPATH="/app/src",PYTHONUNBUFFERED="1"

[program:caddy]
command=caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
